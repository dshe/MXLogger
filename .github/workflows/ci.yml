name: Build, Test, Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish NuGet package?'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      PROJECT_NAME: MXLogger

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_NAME }}.slnx

      - name: Build
        run: dotnet build ${{ env.PROJECT_NAME }}.slnx `
          --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.PROJECT_NAME }}.slnx `
          --configuration Release --no-build

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj `
          --configuration Release `
          --no-restore --no-build `
          -o ./artifacts    

      - name: List artifacts
        run: ls ./artifacts

      - name: NuGet login
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ github.repository_owner }}

      - name: Publish to NuGet
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        run: |
          $pkg = Get-ChildItem ./artifacts/*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName `
            --source https://api.nuget.org/v3/index.json `
            --api-key "${{ steps.nuget-login.outputs.api-key }}" `
            --skip-duplicate
